<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Preview & Hub — Piattaforma Lavoro Condivisa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; }
    .glass-card { background: rgba(18, 24, 38, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .nav-btn.active { background-color: #2563eb; color: #ffffff; border-color: #3b82f6; }
  </style>
</head>
<body class="p-4 md:p-6 font-sans selection:bg-blue-500/30 selection:text-blue-200 min-h-screen flex flex-col">

  <!-- Top Header Toolbar -->
  <header class="max-w-7xl w-full mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-white/10 mb-4">
    <div class="flex items-center gap-3.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20 font-bold text-xl">
        👥
      </div>
      <div>
        <div class="flex items-center gap-2.5">
          <h1 class="text-lg font-bold tracking-tight text-white">Piattaforma Lavoro Condivisa</h1>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">LIVE BROWSER PREVIEW</span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">Naviga tra tutte le sezioni o connettiti direttamente a Localhost :3000</p>
      </div>
    </div>

    <!-- Switcher Sorgente (Cloud Produzione vs Localhost) -->
    <div class="flex items-center gap-2 flex-wrap">
      <div class="bg-black/50 p-1 rounded-xl border border-white/10 flex items-center gap-1 text-xs">
        <button id="src-prod" onclick="setSource('https://aiutiamoci.cloud')" class="px-3 py-1.5 rounded-lg font-semibold transition-all text-white bg-blue-600 shadow-xs">
          ☁️ Cloud (aiutiamoci.cloud)
        </button>
        <button id="src-local" onclick="setSource('http://localhost:3000')" class="px-3 py-1.5 rounded-lg font-semibold transition-all text-slate-400 hover:text-white">
          💻 Locale (:3000)
        </button>
      </div>

      <a id="btn-external" href="https://aiutiamoci.cloud" target="_blank" class="text-xs font-semibold bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl transition-colors flex items-center gap-1.5 border border-white/10">
        <span>Apri Esterno ↗</span>
      </a>
    </div>
  </header>

  <!-- Navigation Tabs (Sezioni della Piattaforma) -->
  <div class="max-w-7xl w-full mx-auto mb-4 flex items-center gap-1.5 overflow-x-auto pb-1 text-xs font-medium">
    <button onclick="navigateRoute('/')" class="nav-btn active px-3.5 py-1.5 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 text-slate-300 transition-colors flex items-center gap-1.5 shrink-0" data-path="/">
      <span>🏠</span> Dashboard Home
    </button>
    <button onclick="navigateRoute('/lavori')" class="nav-btn px-3.5 py-1.5 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 text-slate-300 transition-colors flex items-center gap-1.5 shrink-0" data-path="/lavori">
      <span>📋</span> Lavori (Kanban)
    </button>
    <button onclick="navigateRoute('/files')" class="nav-btn px-3.5 py-1.5 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 text-slate-300 transition-colors flex items-center gap-1.5 shrink-0" data-path="/files">
      <span>📁</span> File & Cartelle (Storage)
    </button>
    <button onclick="navigateRoute('/chat')" class="nav-btn px-3.5 py-1.5 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 text-slate-300 transition-colors flex items-center gap-1.5 shrink-0" data-path="/chat">
      <span>💬</span> Chat & Team
    </button>
    <button onclick="navigateRoute('/posta')" class="nav-btn px-3.5 py-1.5 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 text-slate-300 transition-colors flex items-center gap-1.5 shrink-0" data-path="/posta">
      <span>📬</span> Posta Condivisa (AI)
    </button>
    <button onclick="navigateRoute('/marketing')" class="nav-btn px-3.5 py-1.5 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 text-slate-300 transition-colors flex items-center gap-1.5 shrink-0" data-path="/marketing">
      <span>📢</span> Marketing Hub & Caroselli
    </button>
    <button onclick="navigateRoute('/corsi')" class="nav-btn px-3.5 py-1.5 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 text-slate-300 transition-colors flex items-center gap-1.5 shrink-0" data-path="/corsi">
      <span>🎓</span> Corsi Formativi
    </button>
    <button onclick="navigateRoute('/cervello')" class="nav-btn px-3.5 py-1.5 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 text-slate-300 transition-colors flex items-center gap-1.5 shrink-0" data-path="/cervello">
      <span>🧠</span> Secondo Cervello (Vault)
    </button>
    <button onclick="navigateRoute('/agenti')" class="nav-btn px-3.5 py-1.5 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 text-slate-300 transition-colors flex items-center gap-1.5 shrink-0" data-path="/agenti">
      <span>🤖</span> Agenti Autonomi
    </button>
  </div>

  <!-- Browser Frame Preview Container -->
  <main class="max-w-7xl w-full mx-auto flex-1 flex flex-col glass-card rounded-2xl overflow-hidden shadow-2xl border border-white/10 min-h-[680px]">
    <!-- Fake Browser Address Bar -->
    <div class="px-4 py-2.5 bg-slate-900/90 border-b border-white/10 flex items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-red-500/80 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-yellow-500/80 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-emerald-500/80 inline-block"></span>
      </div>

      <div class="flex-1 max-w-xl mx-auto flex items-center gap-2 bg-black/50 px-3.5 py-1.5 rounded-lg border border-white/10 font-mono text-[11px] text-slate-300">
        <span class="text-emerald-400">🔒</span>
        <span id="url-display" class="truncate">https://aiutiamoci.cloud</span>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="reloadIframe()" class="text-slate-400 hover:text-white p-1 rounded transition-colors" title="Ricarica Anteprima">
          🔄
        </button>
      </div>
    </div>

    <!-- Embedded Live Web App -->
    <div class="flex-1 w-full bg-slate-950 relative">
      <iframe 
        id="preview-frame" 
        src="https://aiutiamoci.cloud" 
        class="w-full h-full min-h-[640px] border-0"
        allow="camera; microphone; fullscreen; clipboard-read; clipboard-write;"
      ></iframe>
    </div>
  </main>

  <!-- Footer Quick Bar -->
  <footer class="max-w-7xl w-full mx-auto mt-4 pt-3 border-t border-white/10 flex items-center justify-between text-xs text-slate-500">
    <div>Progetto: <strong class="text-slate-300">Piattaforma Lavoro Condivisa</strong></div>
    <div class="flex items-center gap-3">
      <span>Stack: Next.js 15 + Supabase</span>
      <button onclick="navigator.clipboard.writeText('npm run dev')" class="text-blue-400 hover:underline">Copia `npm run dev`</button>
    </div>
  </footer>

  <script>
    let currentBaseUrl = 'https://aiutiamoci.cloud';
    let currentPath = '/';

    function updateFrameUrl() {
      const fullUrl = currentBaseUrl.replace(/\/$/, '') + currentPath;
      const frame = document.getElementById('preview-frame');
      const urlDisplay = document.getElementById('url-display');
      const btnExternal = document.getElementById('btn-external');
      
      frame.src = fullUrl;
      urlDisplay.textContent = fullUrl;
      btnExternal.href = fullUrl;
    }

    function navigateRoute(path) {
      currentPath = path;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.getAttribute('data-path') === path) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      updateFrameUrl();
    }

    function setSource(baseUrl) {
      currentBaseUrl = baseUrl;
      const btnProd = document.getElementById('src-prod');
      const btnLocal = document.getElementById('src-local');

      if (baseUrl.includes('localhost')) {
        btnLocal.className = 'px-3 py-1.5 rounded-lg font-semibold transition-all text-white bg-blue-600 shadow-xs';
        btnProd.className = 'px-3 py-1.5 rounded-lg font-semibold transition-all text-slate-400 hover:text-white';
      } else {
        btnProd.className = 'px-3 py-1.5 rounded-lg font-semibold transition-all text-white bg-blue-600 shadow-xs';
        btnLocal.className = 'px-3 py-1.5 rounded-lg font-semibold transition-all text-slate-400 hover:text-white';
      }
      updateFrameUrl();
    }

    function reloadIframe() {
      const frame = document.getElementById('preview-frame');
      frame.src = frame.src;
    }
  </script>

</body>
</html>
